<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier un bien — listing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><strong>listing</strong></a></li>
      </ul>
      <ul>
        <li><a href="/search">Rechercher</a></li>
        <li><a href="/profil">Mon profil</a></li>
        <li><a href="/publier" aria-current="page">Publier un bien</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Publier un bien</h1>

    <form action="/api/listings" method="post" enctype="multipart/form-data">

      <!-- ── Type de bien ── -->
      <fieldset>
        <legend>Type de bien</legend>
        <div>
          <label>
            <input type="radio" name="property_type" value="appartement" required checked>
            Appartement
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="property_type" value="maison">
            Maison
          </label>
        </div>
      </fieldset>

      <!-- ── Localisation ── -->
      <fieldset>
        <legend>Localisation</legend>
        <label for="address">
          Adresse complète
          <small>L'adresse exacte ne sera jamais affichée publiquement.</small>
          <input type="text" id="address" name="address" required
                 placeholder="12 rue de la Paix, 69001 Lyon"
                 autocomplete="street-address">
        </label>
      </fieldset>

      <!-- ── Prix ── -->
      <fieldset>
        <legend>Prix</legend>
        <label for="price">
          Prix de vente (€)
          <input type="number" id="price" name="price" required
                 min="0" step="1000" placeholder="320000">
        </label>
      </fieldset>

      <!-- ── Surfaces ── -->
      <fieldset>
        <legend>Surfaces</legend>
        <label for="surface">
          Surface habitable (m²)
          <input type="number" id="surface" name="surface" required
                 min="1" step="1" placeholder="68">
        </label>
        <div id="field-land-surface" hidden>
          <label for="land_surface">
            Surface du terrain (m²)
            <input type="number" id="land_surface" name="land_surface"
                   min="1" step="1" placeholder="200">
          </label>
        </div>
      </fieldset>

      <!-- ── Pièces ── -->
      <fieldset>
        <legend>Pièces</legend>
        <div class="grid">
          <label for="rooms">
            Nombre de pièces
            <input type="number" id="rooms" name="rooms" required min="1" max="20" placeholder="3">
          </label>
          <label for="bedrooms">
            Nombre de chambres
            <input type="number" id="bedrooms" name="bedrooms" required min="0" max="20" placeholder="2">
          </label>
          <label for="bathrooms">
            Nombre de salles de bain
            <input type="number" id="bathrooms" name="bathrooms" required min="1" max="10" placeholder="1">
          </label>
        </div>
        <div id="field-floor" class="grid">
          <label for="floor">
            Étage
            <input type="number" id="floor" name="floor" min="0" max="100" placeholder="2">
          </label>
          <label for="total_floors" id="field-total-floors">
            Nombre d'étages (immeuble)
            <input type="number" id="total_floors" name="total_floors" min="1" max="100" placeholder="6">
          </label>
        </div>
      </fieldset>

      <!-- ── Énergie ── -->
      <fieldset>
        <legend>Diagnostic énergétique</legend>
        <div class="grid">
          <label for="dpe">
            DPE — consommation énergétique
            <select id="dpe" name="dpe" required>
              <option value="">Choisir</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
            </select>
          </label>
          <label for="ges">
            GES — émissions de gaz à effet de serre
            <select id="ges" name="ges" required>
              <option value="">Choisir</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
            </select>
          </label>
        </div>
        <div class="grid">
          <label for="heating_type">
            Type de chauffage
            <select id="heating_type" name="heating_type" required>
              <option value="">Choisir</option>
              <option value="gaz">Gaz</option>
              <option value="electrique">Électrique</option>
              <option value="fioul">Fioul</option>
              <option value="pac">Pompe à chaleur</option>
              <option value="poele">Poêle</option>
              <option value="autre">Autre</option>
            </select>
          </label>
          <div id="field-heating-mode">
            <label for="heating_mode">
              Collectif ou individuel
              <select id="heating_mode" name="heating_mode">
                <option value="">Choisir</option>
                <option value="collectif">Collectif</option>
                <option value="individuel">Individuel</option>
              </select>
            </label>
          </div>
        </div>
      </fieldset>

      <!-- ── Caractéristiques ── -->
      <fieldset>
        <legend>Caractéristiques</legend>
        <div class="grid">
          <label for="year_built">
            Année de construction
            <input type="number" id="year_built" name="year_built"
                   min="1800" max="2026" placeholder="1987">
          </label>
          <label for="condition">
            État général
            <select id="condition" name="condition" required>
              <option value="">Choisir</option>
              <option value="neuf">Neuf</option>
              <option value="tres_bon_etat">Très bon état</option>
              <option value="bon_etat">Bon état</option>
              <option value="a_rafraichir">À rafraîchir</option>
              <option value="a_renover">À rénover</option>
            </select>
          </label>
        </div>
      </fieldset>

      <!-- ── Équipements ── -->
      <fieldset>
        <legend>Équipements</legend>
        <div id="field-balcony">
          <label>
            <input type="checkbox" name="has_balcony" value="true">
            Balcon / Terrasse
          </label>
        </div>
        <div id="field-cave">
          <label>
            <input type="checkbox" name="has_cave" value="true">
            Cave
          </label>
        </div>
        <div id="field-parking">
          <label for="parking">
            Parking / Garage
            <select id="parking" name="parking">
              <option value="aucun">Aucun</option>
              <option value="box_ferme">Box fermé</option>
              <option value="couvert">Couvert</option>
              <option value="exterieur">Extérieur</option>
            </select>
          </label>
        </div>
        <div id="field-elevator">
          <label>
            <input type="checkbox" name="has_elevator" value="true">
            Ascenseur
          </label>
        </div>
        <div id="field-garden" hidden>
          <label>
            <input type="checkbox" name="has_garden" value="true">
            Jardin
          </label>
        </div>
      </fieldset>

      <!-- ── Photos ── -->
      <fieldset>
        <legend>Photos</legend>
        <label for="photos">
          Ajouter des photos
          <small>Minimum 1 photo, maximum 20. JPG ou PNG, 5 Mo max par photo.</small>
          <input type="file" id="photos" name="photos"
                 accept="image/jpeg,image/png"
                 multiple required>
        </label>
      </fieldset>

      <!-- ── Description ── -->
      <fieldset>
        <legend>Description</legend>
        <label for="description">
          Décrivez votre bien
          <textarea id="description" name="description"
                    rows="6" maxlength="3000" required
                    placeholder="Bel appartement traversant au 2e étage..."></textarea>
          <small><span id="char-count">0</span> / 3000 caractères</small>
        </label>
      </fieldset>

      <div>
        <button type="submit">Publier l'annonce</button>
      </div>

    </form>
  </main>

  <footer class="container">
    <p>listing &copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Compteur de caractères
    const desc  = document.getElementById('description')
    const count = document.getElementById('char-count')
    desc.addEventListener('input', () => count.textContent = desc.value.length)

    // Champs conditionnels selon type de bien
    const apptFields = [
      'field-floor',
      'field-total-floors',
      'field-heating-mode',
      'field-balcony',
      'field-cave',
      'field-parking',
      'field-elevator',
    ]
    const maisonFields = [
      'field-land-surface',
      'field-garden',
    ]

    function updateFields() {
      const isMaison = document.querySelector('[name="property_type"]:checked').value === 'maison'
      apptFields.forEach(id => document.getElementById(id).hidden  =  isMaison)
      maisonFields.forEach(id => document.getElementById(id).hidden = !isMaison)
    }

    document.querySelectorAll('[name="property_type"]')
      .forEach(r => r.addEventListener('change', updateFields))

    // État initial
    updateFields()

    // Auth : redirect si non connecté
    window._authReady.then(({ session }) => {
      if (!session) window.location.href = '/connexion?next=/publier'
    })

    // Soumission avec Bearer token
    document.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault()
      const { session } = await window._authReady
      if (!session) return

      const formData = new FormData(e.target)
      const body = {}
      for (const [key, val] of formData.entries()) {
        if (val instanceof File) continue
        body[key] = val
      }

      const btn = e.target.querySelector('[type="submit"]')
      btn.disabled = true
      btn.textContent = 'Publication en cours…'

      const res = await fetch('/api/listings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify(body),
      })

      if (res.ok) {
        const listing = await res.json()
        window.location.href = `/listings/${listing.id}`
      } else {
        const err = await res.json()
        alert(err.error || 'Erreur lors de la publication')
        btn.disabled = false
        btn.textContent = "Publier l'annonce"
      }
    })
  </script>


</body>
</html>
