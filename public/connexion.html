<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Se connecter — listing</title>
</head>
<body>

  <header>
    <nav>
      <a href="/"><strong>listing</strong></a>
    </nav>
  </header>

  <main>
    <h1>Se connecter</h1>

    <!-- État 1 — saisie email -->
    <div id="step-email">
      <p>Saisissez votre email. Vous recevrez un lien de connexion. Pas de mot de passe.</p>
      <form id="form-email" action="/api/auth/magic-link" method="post">
        <div>
          <label for="email">Adresse email</label><br>
          <input type="email" id="email" name="email" required autofocus
                 placeholder="vous@exemple.fr"
                 autocomplete="email">
        </div>
        <p id="error-msg" hidden style="color:red"></p>
        <div>
          <button type="submit" id="btn-submit">Recevoir le lien de connexion</button>
        </div>
        <p><small>Pas encore de compte ? Il sera créé automatiquement.</small></p>
      </form>
    </div>

    <!-- État 2 — email envoyé (masqué par défaut) -->
    <div id="step-sent" hidden>
      <p>Un lien de connexion a été envoyé à <strong id="email-display"></strong></p>
      <p><small>Lien valable 15 minutes. Vérifiez vos spams.</small></p>
      <div>
        <button type="button" id="btn-resend">Renvoyer le lien</button>
        <button type="button" id="btn-back">Utiliser une autre adresse</button>
      </div>
    </div>

  </main>

  <footer>
    <p>listing &copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script>
    const formEmail   = document.getElementById('form-email')
    const stepEmail   = document.getElementById('step-email')
    const stepSent    = document.getElementById('step-sent')
    const emailDisplay = document.getElementById('email-display')
    const btnResend   = document.getElementById('btn-resend')
    const btnBack     = document.getElementById('btn-back')

    const btnSubmit = document.getElementById('btn-submit')
    const errorMsg  = document.getElementById('error-msg')

    async function sendMagicLink(email) {
      const { sb } = await window._authReady
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: `${window.location.origin}/api/auth/callback` },
      })
      if (error) throw new Error(error.message)
    }

    formEmail.addEventListener('submit', async e => {
      e.preventDefault()
      const email = document.getElementById('email').value
      errorMsg.hidden = true
      btnSubmit.disabled = true
      btnSubmit.textContent = 'Envoi en cours…'
      try {
        await sendMagicLink(email)
        emailDisplay.textContent = email
        stepEmail.hidden = true
        stepSent.hidden  = false
      } catch (err) {
        errorMsg.textContent = err.message
        errorMsg.hidden = false
      } finally {
        btnSubmit.disabled = false
        btnSubmit.textContent = 'Recevoir le lien de connexion'
      }
    })

    btnBack.addEventListener('click', () => {
      stepSent.hidden  = true
      stepEmail.hidden = false
      document.getElementById('email').value = ''
      document.getElementById('email').focus()
    })

    btnResend.addEventListener('click', async () => {
      const email = emailDisplay.textContent
      await sendMagicLink(email).catch(() => {})
      btnResend.textContent = 'Lien renvoyé ✓'
      btnResend.disabled = true
      setTimeout(() => {
        btnResend.textContent = 'Renvoyer le lien'
        btnResend.disabled = false
      }, 5000)
    })
  </script>

</body>
</html>
