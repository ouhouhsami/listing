<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rechercher — listing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><strong>listing</strong></a></li>
      </ul>
      <ul>
        <li><a href="/search" aria-current="page">Rechercher</a></li>
        <li data-nav-auth><a href="/connexion">Se connecter</a></li>
        <li><a href="/publier">Publier un bien</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Rechercher un bien</h1>

    <!-- ── Formulaire de recherche ── -->
    <form action="/search" method="get">

      <fieldset>
        <legend>Type de bien</legend>
        <div>
          <label>
            <input type="radio" name="type" value="appartement" checked>
            Appartement
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="type" value="maison">
            Maison
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Prix maximum (€)</legend>
        <input type="number" id="price_max" name="price_max"
               min="0" step="1000" placeholder="400000"
               value="400000">
      </fieldset>

      <fieldset>
        <legend>Surface minimum (m²)</legend>
        <input type="number" id="surface_min" name="surface_min"
               min="0" step="5" placeholder="50"
               value="50">
      </fieldset>

      <fieldset>
        <legend>Pièces</legend>
        <div class="grid">
          <label for="rooms_min">
            Nombre de pièces minimum
            <select id="rooms_min" name="rooms_min">
              <option value="">Peu importe</option>
              <option value="1">1 pièce</option>
              <option value="2">2 pièces</option>
              <option value="3" selected>3 pièces</option>
              <option value="4">4 pièces</option>
              <option value="5">5 pièces</option>
              <option value="6">6+</option>
            </select>
          </label>
          <label for="bedrooms_min">
            Nombre de chambres minimum
            <select id="bedrooms_min" name="bedrooms_min">
              <option value="">Peu importe</option>
              <option value="1">1 chambre</option>
              <option value="2" selected>2 chambres</option>
              <option value="3">3 chambres</option>
              <option value="4">4+</option>
            </select>
          </label>
        </div>
      </fieldset>

      <!-- Équipements appartement -->
      <fieldset id="equip-appt">
        <legend>Équipements</legend>
        <div>
          <label>
            <input type="checkbox" name="has_balcony" value="true">
            Balcon / Terrasse
          </label>
        </div>
        <div>
          <label>
            <input type="checkbox" name="has_parking" value="true">
            Parking / Garage
          </label>
        </div>
        <div>
          <label>
            <input type="checkbox" name="has_elevator" value="true">
            Ascenseur
          </label>
        </div>
      </fieldset>

      <!-- Équipements maison -->
      <fieldset id="equip-maison" hidden>
        <legend>Équipements</legend>
        <div>
          <label>
            <input type="checkbox" name="has_garden" value="true">
            Jardin
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Zone de recherche</legend>
        <p><small>Dessinez votre zone sur la carte ci-dessous.</small></p>
        <div id="map" style="width:100%;height:400px;border:1px solid;">
          <!-- Carte Leaflet initialisée par JS -->
        </div>
        <input type="hidden" id="zone" name="zone">
        <div>
          <button type="button" id="btn-draw">Dessiner ma zone</button>
          <button type="button" id="btn-clear" hidden>Effacer la zone</button>
        </div>
      </fieldset>

      <div>
        <button type="submit">Rechercher</button>
      </div>

    </form>

    <!-- ── Résultats ── -->
    <section id="results" aria-live="polite" hidden>
      <h2>Résultats <span id="results-count"></span></h2>

      <div>
        <button id="btn-save-search">Sauvegarder cette recherche</button>
      </div>

      <div id="results-list" class="grid"></div>
    </section>

  </main>

  <footer class="container">
    <p>listing &copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>

  <script>
    // ── Type de bien → équipements conditionnels + réinitialisation ──
    document.querySelectorAll('[name="type"]').forEach(r => {
      r.addEventListener('change', () => {
        const isMaison = r.value === 'maison' && r.checked
        document.getElementById('equip-appt').hidden  =  isMaison
        document.getElementById('equip-maison').hidden = !isMaison

        if (isMaison) {
          document.querySelector('[name="has_balcony"]').checked  = false
          document.querySelector('[name="has_parking"]').checked  = false
          document.querySelector('[name="has_elevator"]').checked = false
        } else {
          document.querySelector('[name="has_garden"]').checked = false
        }
      })
    })

    // ── Carte Leaflet ──
    const map = L.map('map').setView([45.754, 4.845], 12)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map)

    const drawnItems = new L.FeatureGroup().addTo(map)
    const drawControl = new L.Control.Draw({
      draw: {
        polygon: { allowIntersection: false },
        polyline: false, rectangle: false,
        circle: false, marker: false, circlemarker: false
      },
      edit: { featureGroup: drawnItems }
    })

    const btnDraw  = document.getElementById('btn-draw')
    const btnClear = document.getElementById('btn-clear')
    const zoneInput = document.getElementById('zone')

    btnDraw.addEventListener('click', () => {
      map.addControl(drawControl)
      new L.Draw.Polygon(map).enable()
      btnDraw.hidden = true
    })

    map.on(L.Draw.Event.CREATED, e => {
      drawnItems.clearLayers()
      drawnItems.addLayer(e.layer)
      zoneInput.value = JSON.stringify(e.layer.toGeoJSON().geometry)
      map.removeControl(drawControl)
      btnClear.hidden = false
    })

    btnClear.addEventListener('click', () => {
      drawnItems.clearLayers()
      zoneInput.value = ''
      btnClear.hidden = true
      btnDraw.hidden  = false
    })

    // ── Sauvegarder la recherche ──
    document.getElementById('btn-save-search').addEventListener('click', async () => {
      const { sb, session } = await window._authReady
      if (!session) {
        window.location.href = `/connexion?next=${encodeURIComponent(window.location.pathname + window.location.search)}&save=1`
        return
      }

      const p = new URLSearchParams(window.location.search)
      const body = { property_type: p.get('type') || 'appartement' }
      if (p.get('price_max'))    body.price_max    = parseInt(p.get('price_max'))
      if (p.get('surface_min'))  body.surface_min  = parseFloat(p.get('surface_min'))
      if (p.get('rooms_min'))    body.rooms_min    = parseInt(p.get('rooms_min'))
      if (p.get('bedrooms_min')) body.bedrooms_min = parseInt(p.get('bedrooms_min'))
      if (p.get('has_balcony')  === 'true') body.has_balcony  = true
      if (p.get('has_parking')  === 'true') body.has_parking  = true
      if (p.get('has_elevator') === 'true') body.has_elevator = true
      if (p.get('has_garden')   === 'true') body.has_garden   = true
      if (p.get('zone')) body.zone = JSON.parse(p.get('zone'))

      const label = generateLabel(body)
      const { error } = await sb.from('saved_searches').insert({
        ...body, user_id: session.user.id, label, alerts_enabled: true
      })

      const btn = document.getElementById('btn-save-search')
      if (error) {
        btn.textContent = 'Erreur lors de la sauvegarde'
      } else {
        btn.textContent = 'Recherche sauvegardée ✓'
        btn.disabled = true
      }
    })

    function generateLabel(s) {
      const parts = []
      if (s.property_type) parts.push(s.property_type === 'appartement' ? 'Appart' : 'Maison')
      if (s.price_max)     parts.push(`max ${Math.round(s.price_max / 1000)}k€`)
      if (s.rooms_min)     parts.push(`${s.rooms_min}p+`)
      if (s.surface_min)   parts.push(`${s.surface_min}m²+`)
      if (s.has_balcony)   parts.push('Balcon')
      if (s.has_parking)   parts.push('Parking')
      if (s.has_elevator)  parts.push('Ascenseur')
      if (s.has_garden)    parts.push('Jardin')
      return parts.join(' · ')
    }

    // ── Restauration des champs depuis les params URL ──
    const params = new URLSearchParams(window.location.search)

    function restoreForm() {
      if (!params.toString()) return

      // Type de bien
      const type = params.get('type')
      if (type) {
        const radio = document.querySelector(`[name="type"][value="${type}"]`)
        if (radio) {
          radio.checked = true
          const isMaison = type === 'maison'
          document.getElementById('equip-appt').hidden  =  isMaison
          document.getElementById('equip-maison').hidden = !isMaison
        }
      }

      // Champs numériques et selects
      ;['price_max', 'surface_min', 'rooms_min', 'bedrooms_min'].forEach(name => {
        const val = params.get(name)
        const el  = document.getElementById(name)
        if (val && el) el.value = val
      })

      // Cases à cocher
      ;['has_balcony', 'has_parking', 'has_elevator', 'has_garden'].forEach(name => {
        if (params.get(name) === 'true') {
          const el = document.querySelector(`[name="${name}"]`)
          if (el) el.checked = true
        }
      })

      // Zone dessinée
      const zone = params.get('zone')
      if (zone) {
        try {
          const geojson = JSON.parse(zone)
          const layer = L.geoJSON(geojson)
          drawnItems.addLayer(layer.getLayers()[0])
          zoneInput.value = zone
          map.fitBounds(layer.getBounds())
          map.addControl(drawControl)
          btnDraw.hidden  = true
          btnClear.hidden = false

          // Mettre à jour l'input quand le polygone est édité
          map.on(L.Draw.Event.EDITED, e => {
            e.layers.eachLayer(l => {
              zoneInput.value = JSON.stringify(l.toGeoJSON().geometry)
            })
          })
        } catch {}
      }
    }

    restoreForm()

    // ── Chargement des résultats ──
    async function loadResults() {
      if (!params.toString()) return

      const res = await fetch('/api/listings?' + params.toString())
      const listings = await res.json()

      const section = document.getElementById('results')
      const count   = document.getElementById('results-count')
      const list    = document.getElementById('results-list')

      section.hidden = false
      count.textContent = `(${listings.length} bien${listings.length > 1 ? 's' : ''})`

      if (!listings.length) {
        list.innerHTML = '<li>Aucun bien ne correspond à votre recherche.</li>'
        return
      }

      list.innerHTML = listings.map(l => `
        <article>
          <header>
            <strong>${l.price.toLocaleString('fr-FR')} €</strong>
            <span> · ${l.city}</span>
          </header>
          <h3><a href="/listings/${l.id}">${l.title}</a></h3>
          <dl>
            <dt>Pièces</dt><dd>${l.rooms}</dd>
            <dt>DPE</dt><dd>${l.dpe}</dd>
          </dl>
          <footer>
            <a href="/listings/${l.id}">Voir l'annonce →</a>
          </footer>
        </article>
      `).join('')
    }

    loadResults()
  </script>

</body>
</html>
