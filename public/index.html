<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>listing — immobilier entre particuliers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><strong>listing</strong></a></li>
      </ul>
      <ul>
        <li><a href="/search">Rechercher</a></li>
        <li data-nav-auth><a href="/connexion">Se connecter</a></li>
        <li><a href="/publier">Publier un bien</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Dernières annonces</h1>
    <div id="listings-list" class="grid"></div>
  </main>

  <footer class="container">
    <p>listing &copy; 2026</p>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    fetch('/api/listings?limit=15')
      .then(r => r.json())
      .then(listings => {
        const list = document.getElementById('listings-list')
        if (!listings.length) return
        list.innerHTML = listings.map(l => `
          <article>
            <header>
              <strong>${l.price.toLocaleString('fr-FR')} €</strong>
              <span> · ${l.city}</span>
            </header>
            <h3><a href="/listings/${l.id}">${l.title}</a></h3>
            <dl>
              <dt>Surface</dt><dd>${l.surface} m²</dd>
              <dt>Pièces</dt><dd>${l.rooms}</dd>
              <dt>DPE</dt><dd>${l.dpe}</dd>
            </dl>
            <footer>
              <time datetime="${l.created_at}">${formatDate(l.created_at)}</time>
            </footer>
          </article>
        `).join('')
      })

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    }
  </script>

</body>
</html>
