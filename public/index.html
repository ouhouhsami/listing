<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>listing — immobilier entre particuliers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

  <header>
    <nav>
      <a href="/"><strong>listing</strong></a>
      <ul>
        <li><a href="/search">Rechercher</a></li>
        <li data-nav-auth><a href="/connexion">Se connecter</a></li>
        <li><a href="/publier">Publier un bien</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Dernières annonces</h1>
    <ul id="listings-list"></ul>
  </main>

  <footer>
    <p>listing &copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script>
    fetch('/api/listings?limit=15')
      .then(r => r.json())
      .then(listings => {
        const list = document.getElementById('listings-list')
        if (!listings.length) return
        list.innerHTML = listings.map(l => `
          <li>
            <article>
              <a href="/listings/${l.id}">
                <h2>${l.title}</h2>
                <dl>
                  <dt>Prix</dt><dd>${l.price.toLocaleString('fr-FR')} €</dd>
                  <dt>Surface</dt><dd>${l.surface} m²</dd>
                  <dt>Pièces</dt><dd>${l.rooms}</dd>
                  <dt>DPE</dt><dd>${l.dpe}</dd>
                  <dt>Ville</dt><dd>${l.city}</dd>
                </dl>
                <time datetime="${l.created_at}">${formatDate(l.created_at)}</time>
              </a>
            </article>
          </li>
        `).join('')
      })

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    }
  </script>

</body>
</html>
