<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — listing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><strong>listing</strong></a></li>
      </ul>
      <ul>
        <li><a href="/search">Rechercher</a></li>
        <li><a href="/profil" aria-current="page">Mon profil</a></li>
        <li><a href="/publier">Publier un bien</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Mon profil</h1>

    <p>
      <strong id="user-email"></strong><br>
      <small id="user-since"></small>
    </p>
    <div>
      <button type="button" id="btn-logout">Se déconnecter</button>
    </div>

    <!-- ── Mes annonces ── -->
    <section>
      <h2>Mes annonces</h2>
      <div><a href="/publier">Publier un nouveau bien</a></div>
      <div id="mes-annonces" class="grid"><p>Chargement…</p></div>
    </section>

    <!-- ── Mes recherches sauvegardées ── -->
    <section>
      <h2>Mes recherches sauvegardées</h2>
      <div id="mes-recherches" class="grid"><p>Chargement…</p></div>
    </section>

  </main>

  <footer class="container">
    <p>listing &copy; 2026</p>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    window._authReady.then(({ user }) => {
      if (!user) { window.location.href = '/connexion?next=/profil'; return }

      document.getElementById('user-email').textContent = user.email
      const since = new Date(user.created_at).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })
      document.getElementById('user-since').textContent = `Membre depuis ${since}`

      loadListings()
      loadSearches()
    })

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' })
      window.location.href = '/'
    })

    // ── Annonces ──────────────────────────────────────────────────────

    async function loadListings() {
      const res  = await fetch('/api/listings/me')
      const data = res.ok ? await res.json() : []

      const grid = document.getElementById('mes-annonces')
      if (!data.length) {
        grid.innerHTML = '<p>Aucune annonce.</p>'
        return
      }

      grid.innerHTML = data.map(l => `
        <article>
          <header>
            <h3><a href="/listings/${l.id}">${l.title}</a></h3>
            <small>${l.status} · ${l.views} vue${l.views > 1 ? 's' : ''}</small>
          </header>
          <dl>
            <dt>Prix</dt><dd>${l.price.toLocaleString('fr-FR')} €</dd>
            <dt>Publié</dt><dd><time datetime="${l.created_at}">${fmt(l.created_at)}</time></dd>
          </dl>
          <footer>
            <a href="/publier?id=${l.id}" role="button" class="outline secondary">Modifier</a>
            ${l.status === 'actif' ? `<button onclick="markSold('${l.id}', this)">Vendu</button>` : ''}
            <button class="outline secondary" onclick="deleteListing('${l.id}', this)">Supprimer</button>
          </footer>
        </article>
      `).join('')
    }

    async function markSold(id, btn) {
      btn.disabled = true
      await fetch(`/api/listings/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'vendu' }),
      })
      const card = btn.closest('article')
      card.querySelector('small').textContent = 'vendu · ' + card.querySelector('small').textContent.split('·')[1]?.trim()
      btn.remove()
    }

    async function deleteListing(id, btn) {
      if (!confirm('Supprimer cette annonce ?')) return
      btn.disabled = true
      await fetch(`/api/listings/${id}`, { method: 'DELETE' })
      btn.closest('article').remove()
    }

    // ── Recherches ────────────────────────────────────────────────────

    async function loadSearches() {
      const res  = await fetch('/api/searches')
      const data = res.ok ? await res.json() : []

      const grid = document.getElementById('mes-recherches')
      if (!data.length) {
        grid.innerHTML = '<p>Aucune recherche sauvegardée.</p>'
        return
      }

      grid.innerHTML = data.map(s => `
        <article>
          <header>
            <h3>${s.label || '(sans titre)'}</h3>
            <small>Alertes : ${s.alerts_enabled ? 'activées' : 'désactivées'}</small>
          </header>
          <footer>
            <a href="/search?${searchParams(s)}" role="button" class="outline">Relancer</a>
            <button class="outline secondary" onclick="toggleAlerts('${s.id}', ${s.alerts_enabled}, this)">
              ${s.alerts_enabled ? 'Désactiver alertes' : 'Activer alertes'}
            </button>
            <button class="outline secondary" onclick="deleteSearch('${s.id}', this)">Supprimer</button>
          </footer>
        </article>
      `).join('')
    }

    async function toggleAlerts(id, current, btn) {
      btn.disabled = true
      const next = !current
      await fetch(`/api/searches/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alerts_enabled: next }),
      })
      btn.textContent = next ? 'Désactiver les alertes' : 'Activer les alertes'
      btn.onclick = () => toggleAlerts(id, next, btn)
      btn.disabled = false
    }

    async function deleteSearch(id, btn) {
      if (!confirm('Supprimer cette recherche ?')) return
      btn.disabled = true
      await fetch(`/api/searches/${id}`, { method: 'DELETE' })
      btn.closest('article').remove()
    }

    function searchParams(s) {
      const p = new URLSearchParams()
      if (s.property_type) p.set('type', s.property_type)
      if (s.price_max)     p.set('price_max', s.price_max)
      if (s.surface_min)   p.set('surface_min', s.surface_min)
      if (s.rooms_min)     p.set('rooms_min', s.rooms_min)
      if (s.bedrooms_min)  p.set('bedrooms_min', s.bedrooms_min)
      if (s.has_balcony)   p.set('has_balcony', 'true')
      if (s.has_parking)   p.set('has_parking', 'true')
      if (s.has_elevator)  p.set('has_elevator', 'true')
      if (s.has_garden)    p.set('has_garden', 'true')
      return p.toString()
    }

    function fmt(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    }
  </script>

</body>
</html>
